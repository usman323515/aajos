[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Prisma's query engine binary must match Netlify's Lambda runtime.
# prisma/schema.prisma already lists "rhel-openssl-3.0.x" alongside
# "native" in binaryTargets so `prisma generate` produces both.
